# Docker Compose for BTC Trading Bot
# First time:  mkdir -p data models && cp .env.example .env
# Run:         docker compose up -d --build

services:
  trading-bot:
    build: .
    container_name: btc-trading-bot
    restart: unless-stopped
    env_file: .env
    environment:
      - PYTHONUNBUFFERED=1
      # DB (+ its -wal/-shm files) and log live in the mounted ./data folder.
      - DATA_DIR=/app/data
    volumes:
      - ./data:/app/data
      - ./models:/app/models
    ports:
      # Localhost only: the dashboard has no login, and Docker bypasses ufw.
      # View it through an SSH tunnel: ssh -L 8050:localhost:8050 user@server
      - "127.0.0.1:8050:8050"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
